name: ci

# Builds and tests Globw on Windows, Linux and macOS. On a version tag
# (e.g. v0.1.0) it also packages the `gw` and `gwget` binaries for each
# platform and publishes them as assets on a GitHub Release.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# When a new run starts for the same branch/tag, cancel the older in-progress
# one so stale runs don't linger waiting for (scarce) macOS runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: globw-linux-x86_64.tar.gz
            pkg_arch: amd64
          - os: ubuntu-24.04-arm
            asset: globw-linux-aarch64.tar.gz
            pkg_arch: arm64
          - os: macos-latest
            asset: globw-macos-aarch64.tar.gz
          - os: windows-latest
            asset: globw-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      # Linux needs the X11/Wayland/xkb dev packages for the minifb window,
      # and a C toolchain (already present) for the bundled SQLite and tinyfd.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release --bins

      # Dev profile (panic=unwind): release sets panic=abort, which clashes with
      # the test harness's unwinding when building the integration tests.
      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo test

      # Package the two binaries into one per-OS archive with a stable name,
      # so the website can link to releases/latest/download/<asset>.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -C target/release -czf "${{ matrix.asset }}" gw gwget

      # Build Linux .deb and .rpm packages (gw + gwget -> /usr/bin) with nfpm.
      - name: Linux packages (deb + rpm)
        if: runner.os == 'Linux'
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v[0-9] ]]; then export PKG_VERSION="${REF#v}"; else export PKG_VERSION="0.0.0"; fi
          export PKG_ARCH="${{ matrix.pkg_arch }}"
          if [ "$PKG_ARCH" = "amd64" ]; then RPM_ARCH=x86_64; else RPM_ARCH=aarch64; fi
          # stable filenames (no version) so the website can link releases/latest/download/<file>
          nfpm package -f nfpm.yaml -p deb -t "globw-linux-${PKG_ARCH}.deb"
          nfpm package -f nfpm.yaml -p rpm -t "globw-linux-${RPM_ARCH}.rpm"
          ls -1 *.deb *.rpm

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: globw-linux-packages-${{ matrix.pkg_arch }}
          path: |
            *.deb
            *.rpm

      - name: Publish Linux packages to the release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
          fail_on_unmatched_files: true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/gw.exe, target/release/gwget.exe -DestinationPath "${{ matrix.asset }}"
        shell: pwsh

      # Build the guided GUI installer (globw-setup.exe) with Inno Setup.
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v[0-9]') { $v = $ref.TrimStart('v') } else { $v = '0.0.0-dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v installer\globw.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup (ISCC) failed with exit $LASTEXITCODE" }

      - name: Upload installer artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: globw-setup.exe
          path: installer/output/globw-setup.exe

      - name: Publish installer to the release (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/globw-setup.exe
          fail_on_unmatched_files: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
