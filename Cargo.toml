[package]
name = "globw"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.42"
crc32fast = "1.4.2"
font8x8 = "0.3"
fontdue = "0.9.4"
minifb = "0.29"
regex = "1.11.1"
serde_json = "1.0.140"
sha2 = "0.10.8"
ureq = "2.12.1"
uuid = { version = "1.11.0", features = ["v4"] }
ttf-parser = "0.25.1"
