[package]
name = "globw"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

# The interpreter: run a program with `gw program.gw`.
[[bin]]
name = "gw"
path = "src/main.rs"

# The package manager for external libraries: `gwget install <name>`.
[[bin]]
name = "gwget"
path = "src/bin/gwget.rs"
required-features = ["native"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
# Native build: the modules that need a desktop OS (windows, SQLite, networking,
# dialogs, dynamic BLAS, threads). On by default; the wasm playground builds
# without it, and those modules then report a clean "not available here" error.
default = ["native", "gpu", "jit"]
native = [
    "dep:minifb", "dep:rusqlite", "dep:tiny_http", "dep:tinyfiledialogs",
    "dep:ureq", "dep:libloading", "dep:rayon", "dep:arboard", "matrixmultiply/threading",
    "dep:png", "dep:jpeg-decoder",
]
# GPU backend (wgpu): draws the built-in 3D on the GPU when a window opens and a
# GPU answers (software otherwise), and runs nungw kernels after nungw.gpu(true).
# On by default; the wasm playground builds with --no-default-features.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Optional: a fully general FFI via libffi (arbitrary C signatures, mixing int and
# float arguments). Off by default because it compiles the C libffi at build time,
# which the plain "single binary, builds everywhere" build avoids. Without it, the
# pure-Rust ffi.int/ffi.real/ffi.cstr/ffi.buffer path still works.
ffi-full = ["native", "dep:libffi"]
# The JIT (Cranelift): hot numeric functions and loops become machine code. On by
# default for the desktop; the wasm playground and --no-default-features builds
# use the interpreter only.
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:rayon"]

[dependencies]
# portable everywhere (native and wasm)
base64 = "0.22.1"
chrono = "0.4.42"
crc32fast = "1.4.2"
font8x8 = "0.3"
fontdue = "0.9.4"
matrixmultiply = "0.3.9"
rustfft = "6.2.0"
wide = "0.7.33"
regex = "1.11.1"
serde_json = "1.0.140"
sha2 = "0.10.8"
uuid = { version = "1.11.0", features = ["v4"] }
ttf-parser = "0.25.1"
web-time = "1.1.0"
# native-only, enabled by the `native` feature
minifb = { version = "0.29", optional = true }
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
tiny_http = { version = "0.12.0", optional = true }
tinyfiledialogs = { version = "3.9.1", optional = true }
ureq = { version = "2.12.1", optional = true }
libloading = { version = "0.8.6", optional = true }
arboard = { version = "3.4", optional = true, default-features = false }
rayon = { version = "1.10.0", optional = true }
libffi = { version = "3.2.0", optional = true }
# GPU backend, enabled by the `gpu` feature
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.21.0", optional = true }
png = { version = "0.18.1", optional = true }
jpeg-decoder = { version = "0.3.2", default-features = false, optional = true }
cranelift-codegen = { version = "0.138.0", optional = true }
cranelift-frontend = { version = "0.138.0", optional = true }
cranelift-jit = { version = "0.138.0", optional = true }
cranelift-module = { version = "0.138.0", optional = true }
cranelift-native = { version = "0.138.0", optional = true }

# wasm playground: the glue to call the interpreter from JavaScript
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.95"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.11.0", features = ["v4", "js"] }
chrono = { version = "0.4.42", features = ["wasmbind"] }
