# nfpm config: builds the Linux .deb and .rpm packages for Globw.
# PKG_ARCH (amd64|arm64) and PKG_VERSION are set by the CI from the matrix/tag.
# Build locally with:  nfpm package -f nfpm.yaml -p deb   (needs the release binaries)
name: globw
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
# taken as it is: versions like 0.1.7m are not semver (dpkg and rpm order them
# right: 0.1.7 < 0.1.7m < 0.1.8)
version_schema: none
section: devel
priority: optional
maintainer: Globw <160625041+Globw@users.noreply.github.com>
description: |
  Globw is a statically-typed language with its own syntax and a fast Rust
  engine, in a single file. Graphics, databases, networking, audio, an AI
  client and an array engine are built in. Ships the interpreter (gw) and
  the package manager (gwget).
vendor: Globw
homepage: https://globw.org
license: Apache-2.0
contents:
  - src: ./target/release/gw
    dst: /usr/bin/gw
  - src: ./target/release/gwget
    dst: /usr/bin/gwget
  # syntax highlighting for terminal editors (see editors/README.md)
  - src: ./editors/nano/globw.nanorc
    dst: /usr/share/nano/globw.nanorc
  - src: ./editors/vim/syntax/globw.vim
    dst: /usr/share/vim/vimfiles/syntax/globw.vim
  - src: ./editors/vim/ftdetect/globw.vim
    dst: /usr/share/vim/vimfiles/ftdetect/globw.vim
  - src: ./editors/vim/ftplugin/globw.vim
    dst: /usr/share/vim/vimfiles/ftplugin/globw.vim
  - src: ./editors/micro/globw.yaml
    dst: /usr/share/globw/editors/micro/globw.yaml
  - src: ./editors/README.md
    dst: /usr/share/globw/editors/README.md
